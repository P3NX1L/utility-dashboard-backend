services:
  - type: web
    name: first-western-tenant-notices
    runtime: static
    buildCommand: bun install --frozen-lockfile && bun run build:render
    staticPublishPath: dist/client
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://uowhdiufxssggeihiece.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /five-day
        destination: /five-day/index.html
      - type: rewrite
        source: /access
        destination: /access/index.html
      - type: rewrite
        source: /*
        destination: /index.html